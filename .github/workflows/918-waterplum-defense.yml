name: 918 WaterPlum Defense

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  waterplum-defense:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pinned FADS WaterPlum sensor
        run: python -m pip install "git+https://github.com/918Tech/FADS-GATE.git@4bdc2f9adc4035d4fa70a68f8743435cb0300d56"

      - name: Evaluate repository telemetry
        shell: bash
        run: |
          set +e
          fads-waterplum-scan \
            --root . \
            --endpoint https://nine18-fads-waterplum.onrender.com/v1/evaluate \
            --endpoint https://nine18-fads-oregon.onrender.com/v1/evaluate \
            --endpoint https://nine18-fads-frankfurt.onrender.com/v1/evaluate \
            --endpoint https://nine18-fads-singapore.onrender.com/v1/evaluate \
            --fail-on restricted \
            --output waterplum-evidence.json
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::warning::WaterPlum mesh unavailable; repository scan recorded as degraded external telemetry."
            printf '%s\n' '{"status":"degraded","reason":"mesh_unavailable","source":"918-waterplum-defense"}' > waterplum-evidence.json
            exit 0
          fi
          exit "$rc"

      - name: Preserve WaterPlum evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 918-waterplum-evidence
          path: waterplum-evidence.json
          if-no-files-found: ignore
          retention-days: 30
