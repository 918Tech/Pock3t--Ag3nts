<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pocket Agents // 918</title><style>
:root{--b:#05080b;--p:#0b1117;--l:#263540;--t:#e8f3f6;--m:#84939d;--c:#7ef7ff;--o:#ffbd5a;--g:#72efa5;--r:#ff6875}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 30%,#101923,#030507 65%);color:var(--t);font:12px ui-monospace,monospace;height:100svh;display:grid;place-items:center}.app{width:min(100%,430px);height:min(100svh,780px);background:#070b0f;border:1px solid var(--l);display:grid;grid-template-rows:48px 1fr 64px;overflow:hidden}.top{display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--l);gap:8px}.brand{color:var(--c);font-weight:900;letter-spacing:.1em}.spacer{flex:1}.screen{overflow:auto;padding:11px}.nav{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--l)}button{font:inherit;color:var(--t);background:#0d151c;border:1px solid var(--l);padding:9px;cursor:pointer}.nav button{border:0;border-right:1px solid #111b22;color:var(--m);font-size:9px}.nav button.on,.pri{color:var(--c);border-color:var(--c)}h1,h2,h3{margin:.3em 0}.hero,.card,.stat{border:1px solid var(--l);background:var(--p);padding:10px;margin-bottom:8px}.hero h1{font-size:28px;line-height:.9}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat b{font-size:18px;display:block}.muted{color:var(--m)}.tiny{font-size:9px}.row{display:flex;align-items:center;gap:8px}.spread{justify-content:space-between}.badge{border:1px solid var(--l);padding:2px 5px;font-size:8px}.ok{color:var(--g)}.warn{color:var(--o)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.skill{padding:7px;border:1px solid #1c2933;margin-top:5px}.danger{color:var(--r)}canvas{width:100%;max-width:300px;aspect-ratio:5/6;background:#05080b;border:1px solid var(--l);touch-action:none;image-rendering:pixelated}.arena{display:grid;place-items:center}.dpad{display:grid;grid-template-columns:repeat(3,52px);justify-content:center;gap:5px;margin:8px}.dpad button{height:44px}.log{font-size:9px;border-left:2px solid var(--l);padding:5px 8px;margin:5px 0;word-break:break-all}.radar{width:190px;height:190px;border-radius:50%;border:1px solid var(--c);margin:12px auto;background:repeating-radial-gradient(circle,transparent 0 29px,#10313a 30px 31px);display:grid;place-items:center}.input{width:100%;padding:8px;background:#05080b;color:var(--t);border:1px solid var(--l)}@media(max-width:460px){.app{width:100%;height:100svh;border:0}}
</style></head><body><main class="app"><header class="top"><button id="menu">☰</button><div class="brand">918 // POCKET AGENTS</div><div class="spacer"></div><span id="net" class="ok">●</span></header><section id="screen" class="screen"></section><nav class="nav" id="nav"></nav></main><script>
const K='pocket-agents.pages.v2';const G={profile:{handle:'NINE1EIGHT',credits:918,encounters:0,vsWins:0,vsLosses:0,vsBest:0},agents:[['AX-9','RECON',9,1,'◉'],['VANTA','STEALTH',7,1,'◆'],['ROOK','BREACH',6,1,'▣'],['KESTREL','SCOUT',8,0,'△'],['NULL-7','GHOST',10,0,'◇'],['MAKO','TACTIC',5,0,'⌁']].map((x,i)=>({id:'a'+i,name:x[0],class:x[1],level:x[2],owned:!!x[3],glyph:x[4],xp:0})),skills:[['Ghost Step',82,1],['Signal Trace',76,0],['Hard Lock',69,2],['Counter Map',72,0],['Phase Cloak',91,4],['Vector Dash',79,3],['Trap Weave',64,5],['Signal Trace',71,3],['Null Field',88,4],['Hard Lock',61,5]].map((x,i)=>({id:'s'+i,name:x[0],power:x[1],owner:'a'+x[2]})),market:[{id:'m1',skill:'s6',price:145,active:true},{id:'m2',skill:'s7',price:190,active:true}],ledger:[]};let S=JSON.parse(localStorage.getItem(K)||'null')||structuredClone(G);S.active=S.active||'a0';S.ledger=S.ledger||[];const save=()=>localStorage.setItem(K,JSON.stringify(S));const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const agent=id=>S.agents.find(a=>a.id===id);const skills=id=>S.skills.filter(s=>s.owner===id);const power=id=>agent(id).level*10+Math.round(skills(id).reduce((n,s)=>n+s.power,0)/Math.max(1,skills(id).length));function event(type,payload={}){S.ledger.push({type,payload,at:new Date().toISOString(),hash:crypto.randomUUID()});save()}function route(r){location.hash=r;render(r)}
const routes=['home','agents','vs','scan','market','ledger'];nav.innerHTML=routes.map(r=>`<button data-r="${r}">${r.toUpperCase()}</button>`).join('');nav.onclick=e=>e.target.dataset.r&&route(e.target.dataset.r);function cards(){return S.agents.filter(a=>a.owned).map(a=>`<div class="card row spread"><div class="row"><b style="font-size:24px">${a.glyph}</b><div><b>${a.name}</b><div class="tiny muted">${a.class} // LVL ${a.level}</div></div></div><div><b>${power(a.id)}</b><button data-active="${a.id}">${S.active===a.id?'ACTIVE':'SET'}</button></div></div>`).join('')}
function render(r=(location.hash.slice(1)||'home')){routes.includes(r)||(r='home');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.r===r));stopGame();if(r==='home')screen.innerHTML=`<div class="hero"><div class="tiny muted">918 TECHNOLOGIES // FIELD NODE</div><h1>POCKET<br>AGENTS</h1><div class="muted">Exclusive skills. Atomic transfers. Playable VS. Provenance ledger.</div></div><div class="grid"><div class="stat"><b>${S.agents.filter(a=>a.owned).length}</b>AGENTS</div><div class="stat"><b>${S.profile.credits}</b>CREDITS</div><div class="stat"><b>${S.profile.encounters}</b>ENCOUNTERS</div><div class="stat"><b>${S.ledger.length}</b>EVENTS</div></div><div class="actions"><button class="pri" data-go="vs">PLAY VS</button><button data-go="scan">STEALTH SCAN</button></div><h3>ACTIVE</h3>${cards()}`;if(r==='agents')screen.innerHTML=`<h2>ROSTER</h2>${cards()}<div class="card"><b>SKILL LAW</b><p class="muted">Every skill instance has one owner. Transfers move ownership; they never clone it.</p>${S.skills.map(s=>`<div class="skill"><b>${s.name}</b> <span class="muted">${s.id} // ${agent(s.owner).name}</span></div>`).join('')}</div>`;if(r==='scan')scanView();if(r==='market')marketView();if(r==='ledger')ledgerView();if(r==='vs')vsView();screen.onclick=clicks}
function clicks(e){let x=e.target;if(x.dataset.go)return route(x.dataset.go);if(x.dataset.active){if(agent(x.dataset.active).owned){S.active=x.dataset.active;save();render()}}if(x.dataset.enc){S.profile.encounters++;event('ENCOUNTER',{remote:x.dataset.enc});render('scan')}if(x.dataset.buy){let l=S.market.find(m=>m.id===x.dataset.buy&&m.active),sk=S.skills.find(s=>s.id===l?.skill);if(!l||!sk||S.profile.credits<l.price)return alert('Unavailable');S.profile.credits-=l.price;sk.owner=S.active;l.active=false;event('PURCHASE',{listing:l.id,skill:sk.id,to:S.active});marketView()}if(x.dataset.reset&&confirm('Reset local Pocket Agents world?')){localStorage.removeItem(K);location.reload()}if(x.dataset.mv)move(x.dataset.mv);if(x.dataset.start)startGame();if(x.dataset.pause)pauseGame()}
function scanView(){let rem=S.agents.filter(a=>!a.owned);screen.innerHTML=`<h2>STEALTH SCANNER</h2><div class="radar"><b>◎ ${rem.length} CONTACTS</b></div>${rem.map(a=>`<div class="card row spread"><div><b>${a.glyph} ${a.name}</b><div class="tiny muted">${a.class} // PWR ${power(a.id)}</div></div><button class="pri" data-enc="${a.id}">ENCOUNTER</button></div>`).join('')}`}
function marketView(){let live=S.market.filter(m=>m.active);screen.innerHTML=`<div class="row spread"><h2>MARKET</h2><b>${S.profile.credits} CR</b></div>${live.map(l=>{let s=S.skills.find(x=>x.id===l.skill);return `<div class="card row spread"><div><b>${s.name}</b><div class="tiny muted">${s.id} // OWNER ${agent(s.owner).name}</div></div><div><b>${l.price}</b><br><button class="pri" data-buy="${l.id}">BUY</button></div></div>`}).join('')||'<div class="card">NO LIVE LISTINGS</div>'}`}
function ledgerView(){screen.innerHTML=`<div class="row spread"><h2>DAG LEDGER</h2><button data-reset="1" class="danger">RESET</button></div>${[...S.ledger].reverse().map(e=>`<div class="log"><b>${e.type}</b><br>${e.at}<br>${e.hash}</div>`).join('')||'<div class="card">GENESIS // NO EVENTS YET</div>'}`}
let game=null,raf=0,ctx,cv,last=0;function vsView(){let a=agent(S.active),r=S.agents.filter(x=>!x.owned).sort((x,y)=>y.level-x.level)[0];screen.innerHTML=`<div class="row spread"><div><div class="tiny muted">GRID RUNNER VS</div><h2>${a.name} VS ${r.name}</h2></div><span class="badge ok">PLAYABLE</span></div><div class="grid3"><div class="stat"><b>${S.profile.vsWins||0}</b>WINS</div><div class="stat"><b>${S.profile.vsLosses||0}</b>LOSSES</div><div class="stat"><b>${S.profile.vsBest||0}</b>BEST</div></div><div class="arena"><canvas id="cv" width="300" height="360"></canvas></div><div class="row spread tiny"><span id="st">READY</span><b id="sc">0</b></div><div class="actions"><button class="pri" data-start="1">START / RESTART</button><button data-pause="1">PAUSE</button></div><div class="dpad"><i></i><button data-mv="u">▲</button><i></i><button data-mv="l">◀</button><button data-mv="d">▼</button><button data-mv="r">▶</button></div><div class="card tiny muted">Race to the uplink. Avoid moving sentries. Arrow keys/WASD, swipe, or D-pad.</div>`;cv=document.getElementById('cv');ctx=cv.getContext('2d');game={p:{c:2,r:8},ai:{c:3,r:8},run:0,score:0,t:0,aiT:0,won:null};draw();cv.onpointerdown=e=>cv._p=[e.clientX,e.clientY];cv.onpointerup=e=>{let p=cv._p;if(!p)return;let dx=e.clientX-p[0],dy=e.clientY-p[1];Math.max(Math.abs(dx),Math.abs(dy))>20&&move(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))}}
const lanes=[{r:2,v:70,w:44,o:[10,145,255]},{r:3,v:-92,w:52,o:[65,215]},{r:4,v:118,w:38,o:[20,120,235]},{r:5,v:-78,w:58,o:[0,165]},{r:6,v:102,w:46,o:[35,190,280]},{r:7,v:-126,w:42,o:[75,225]}];function obs(l){return l.o.map(o=>((o+l.v*game.t/1000)%300+300)%300)}function hit(q){let l=lanes.find(x=>x.r===q.r);if(!l)return 0;let x=q.c*50+25;return obs(l).some(o=>Math.min(Math.abs(x-o),300-Math.abs(x-o))<l.w/2+12)}function draw(){if(!game||!ctx)return;ctx.fillStyle='#05080b';ctx.fillRect(0,0,300,360);ctx.strokeStyle='#16303a';for(let x=0;x<=300;x+=50){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,360);ctx.stroke()}for(let y=0;y<=360;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(300,y);ctx.stroke()}lanes.forEach(l=>obs(l).forEach(x=>{ctx.fillStyle='#6a2830';ctx.fillRect(x-l.w/2,l.r*40+6,l.w,28)}));[['AI',game.ai,'#ffbd5a'],['YOU',game.p,'#7ef7ff']].forEach(([n,q,c])=>{ctx.fillStyle=c;ctx.fillRect(q.c*50+12,q.r*40+7,26,26);ctx.fillStyle='#020304';ctx.fillText(n,q.c*50+14,q.r*40+24)});st.textContent=game.run?'RUNNING':game.won===null?'READY':game.won?'WON':'LOST';sc.textContent=Math.round(game.score)}function startGame(){game.p={c:2,r:8};game.ai={c:3,r:8};game.run=1;game.won=null;game.score=0;game.t=0;game.aiT=0;last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}function pauseGame(){game&&(game.run=!game.run,last=performance.now(),game.run&&(raf=requestAnimationFrame(loop)),draw())}function move(d){if(!game?.run)return;let m={u:[0,-1],d:[0,1],l:[-1,0],r:[1,0]}[d];game.p.c=Math.max(0,Math.min(5,game.p.c+m[0]));game.p.r=Math.max(0,Math.min(8,game.p.r+m[1]));game.score+=d==='u'?80:10;if(hit(game.p))finish(0,'SENTRY');else if(game.p.r===0)finish(1,'UPLINK');draw()}function finish(w,why){if(!game?.run)return;game.run=0;game.won=!!w;w?S.profile.vsWins++:S.profile.vsLosses++;game.score=Math.round(game.score+(w?1000:0));S.profile.vsBest=Math.max(S.profile.vsBest||0,game.score);agent(S.active).xp+=(w?25:8);event('VS_MATCH',{won:!!w,score:game.score,reason:why});draw()}function loop(t){if(!game?.run)return;let dt=Math.min(40,t-last);last=t;game.t+=dt;game.score+=dt*.01;if(hit(game.p))return finish(0,'SENTRY');if(t-game.aiT>700){game.aiT=t;let nr=Math.max(0,game.ai.r-1),opts=[0,-1,1].map(d=>({c:Math.max(0,Math.min(5,game.ai.c+d)),r:nr})).filter(q=>!hit(q));opts.length&&(game.ai=opts[0]);if(game.ai.r===0)return finish(0,'RIVAL')}draw();raf=requestAnimationFrame(loop)}function stopGame(){cancelAnimationFrame(raf);raf=0}addEventListener('keydown',e=>{if((location.hash||'#home')!=='#vs')return;let m={ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',ArrowLeft:'l',a:'l',ArrowRight:'r',d:'r'}[e.key];m&&(e.preventDefault(),move(m))});menu.onclick=()=>alert('Pocket Agents Web v2 // Routes: Home, Agents, VS, Scan, Market, Ledger');net.className=navigator.onLine?'ok':'danger';render();
</script></body></html>
